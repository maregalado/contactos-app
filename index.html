<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Contactos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app">

    <header class="header">
      <h1 class="header__title">Mis Contactos</h1>
      <p class="header__sub">Gestiona tu agenda personal</p>
    </header>

    <main class="main">

      <!-- Formulario para añadir contacto -->
      <section class="form-section">
        <h2 class="section-title">Añadir contacto</h2>
        <form id="form-contacto" class="form" novalidate>
          <div class="form__group">
            <label class="form__label" for="nombre">Nombre completo *</label>
            <input class="form__input" type="text" id="nombre" placeholder="Ej: Ana García" />
          </div>
          <div class="form__group">
            <label class="form__label" for="telefono">Teléfono *</label>
            <input class="form__input" type="tel" id="telefono" placeholder="Ej: 612345678" />
          </div>
          <div class="form__group">
            <label class="form__label" for="email">Email</label>
            <input class="form__input" type="email" id="email" placeholder="Ej: ana@email.com" />
          </div>
          <div class="form__group">
            <label class="form__label" for="categoria">Categoría</label>
            <select class="form__input" id="categoria">
              <option value="personal">Personal</option>
              <option value="trabajo">Trabajo</option>
              <option value="familia">Familia</option>
            </select>
          </div>
          <div class="form__group">
            <label class="form__label" for="notas">Notas</label>
            <textarea class="form__input form__textarea" id="notas" placeholder="Ej: Compañero del trabajo, cumple en marzo..."></textarea>
          </div>
          <div id="error-msg" class="error-msg" style="display:none;"></div>
          <button type="submit" class="btn btn--primary">Guardar contacto</button>
        </form>
      </section>

      <!-- Panel de búsqueda y lista -->
      <section class="list-section">
        <div class="list-header">
          <h2 class="section-title">Contactos <span id="contador" class="contador">0</span></h2>
          <div class="list-header__acciones">
            <input class="form__input search-input" type="text" id="buscador" placeholder="Buscar por nombre..." />
            <button class="btn btn--secundario" onclick="exportarCSV()">Exportar CSV</button>
          </div>
        </div>
        <div id="lista-contactos" class="contact-list">
          <p class="empty-state">No hay contactos aún. ¡Añade el primero!</p>
        </div>
      </section>

    </main>

  </div>

  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
